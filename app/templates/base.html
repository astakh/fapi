<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Список задач{% endblock %}</title>

    <!-- Water.css — минималистичный CSS-фреймворк без классов -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">

    <!-- Кастомные стили -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- HTMX — динамические HTML-обновления без JavaScript -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <!-- Alpine.js — лёгкий реактивный фреймворк -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Список задач</h1>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>FastAPI + HTMX + Alpine.js + Water.css</p>
        </footer>
    </div>
</body>
</html>
